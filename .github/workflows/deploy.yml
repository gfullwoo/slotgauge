name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'slotgauge' }}
  REGION: ${{ vars.GCP_REGION || 'us-east4' }}
  SERVICE: slotgauge
  AR_REPO: slotgauge

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1 --memory=512Mi
            --min-instances=0 --max-instances=3
            --concurrency=80
            --cpu-throttling
            --service-account=slotgauge-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }},FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }},SCANS_BUCKET=${{ vars.SCANS_BUCKET }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-5' }},GEMINI_ENABLED=${{ vars.GEMINI_ENABLED || '0' }},GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }},IDENTIFY_PROVIDER=${{ vars.IDENTIFY_PROVIDER || 'auto' }}
            ${{ vars.SCANS_BUCKET && '--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest' || '' }}
          labels: app=slotgauge,commit=${{ github.sha }}

      - name: Smoke test
        run: |
          URL="${{ steps.run.outputs.url }}"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/api/health"; then echo; curl -fsS "$URL/api/config"; echo; echo "Deployed $URL"; exit 0; fi
            echo "not ready yet ($i)…"; sleep 5
          done
          echo "health check never came up"; exit 1
