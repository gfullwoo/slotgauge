<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f6f8c"/>
  <!-- Artwork is centred as a whole: the fish + gauge span y 7.9–56, so the top and bottom margins match.
       The fish itself is nudged left so its own centre sits on x=32 — it used to end 2px from the right
       edge (tail almost touching) while the nose had 5px of room. -->
  <g transform="translate(0,-4)">
    <g transform="translate(-1.5,0)">
      <g fill="#e8f0f2">
        <!-- dorsal fin -->
        <path d="M19 18c7-6 17-8 25-4l-4 9H17z"/>
        <!-- body -->
        <path d="M5 29C9 18 22 13 36 15.5c6 1 11 5 15 13.5-4 8.5-9 12.5-15 13.5C22 45 9 40 5 29z"/>
        <!-- tail -->
        <path d="M45 29l17-11.5v23z"/>
        <!-- pectoral fin -->
        <path d="M21 35c3-1 7-1 10 1-2 4-6 6-9 5z" fill="#c6d8dd"/>
      </g>
      <!-- gill line + eye -->
      <path d="M19 22.5c-2 3-2 9 0 13" fill="none" stroke="#0f6f8c" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="12.5" cy="27" r="2.6" fill="#0d171c"/>
      <circle cx="13.4" cy="26.2" r=".8" fill="#fff"/>
    </g>
    <!-- slot gauge: thin strip under the fish (already centred on x=32) -->
    <rect x="7" y="49" width="50" height="9" rx="2.5" fill="#e8f0f2"/>
    <rect x="24" y="49" width="18" height="9" fill="#5fd39a"/>
    <rect x="23" y="47" width="2.2" height="13" rx="1" fill="#0d171c"/>
    <rect x="40.8" y="47" width="2.2" height="13" rx="1" fill="#0d171c"/>
    <g fill="#0f6f8c"><rect x="12" y="54" width="1.4" height="4"/><rect x="17.5" y="54" width="1.4" height="4"/><rect x="46" y="54" width="1.4" height="4"/><rect x="51.5" y="54" width="1.4" height="4"/></g>
  </g>
</svg>
