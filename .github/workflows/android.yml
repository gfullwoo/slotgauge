name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore (only when the secret is set)
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/release.keystore

      - name: Build
        working-directory: android
        run: |
          if [ -f release.keystore ]; then gradle --no-daemon assembleRelease; else gradle --no-daemon assembleDebug; fi

      - name: Signing certificate fingerprint (paste into the ANDROID_CERT_SHA256 repo variable)
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}; AS=$(ls -d $SDK/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs "$APK" | grep -i 'SHA-256' | tee cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slotgauge-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/cert.txt
